<p>
    This PHP demo shows how to access the certificate and private key in a PFX/P12 file with the use of the
    <a href="https://php.net/openssl_pkcs12_read" target="_blank"><code>openssl_pkcs12_read()</code></a> function.<br/>
    After passing both to the <a href="https://manuals.setasign.com/setapdf-signer-manual/signature-modules/" target="_blank">signing module</a>
    the PDF document can be signed.
</p>
