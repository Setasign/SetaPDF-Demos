<p>
    This PHP demo shows how to
    <a href="https://manuals.setasign.com/setapdf-formfiller-manual/xfa-forms/#index-3-1" target="_blank">fill a dynamic XFA form</a>.
</p>
<p>
    A <a href="https://manuals.setasign.com/setapdf-formfiller-manual/xfa-forms/#index-3" target="_blank">dynamic XFA form</a>
    only uses the PDF format as a container while the whole content is rendered at runtime.<br/>
    You need to use a PDF viewer that supports XFA for both the template and the result.
</p>
