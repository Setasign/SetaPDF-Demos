<p>
    This PHP demo shows how to access
    <a href="https://manuals.setasign.com/setapdf-formfiller-manual/field-types/signature-fields/" target="_blank">
        signature fields</a> and
    <a href="https://manuals.setasign.com/setapdf-formfiller-manual/field-types/push-button-fields/" target="_blank">
        push button fields</a> in a PDF docuement.
</p>
<p>
    Both field types are read-only implementations. Technically it is implemented to allow the
    <a href="https://www.setasign.com/products/setapdf-formfiller/" target="_blank">SetaPDF-FormFiller</a> component
    access to a field appearance and to flatten it.
</p>
