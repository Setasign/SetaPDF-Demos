<p>
    This PHP demo shows how to extract glyphs using the
    <a href="https://manuals.setasign.com/setapdf-extractor-manual/strategies/glyph/" target="_blank">glyph</a>
    strategy. It shows all used glyphs of a PDF document and their positions.
</p>
<p>
    This strategy is used internally to order glyphs before creating text or words from them.
</p>
